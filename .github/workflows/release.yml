name: Release
run-name: "Release ${{ inputs.version || (inputs.bump && format('({0})', inputs.bump)) || github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (ignored if version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Explicit version override, e.g. v1.2.3 (optional)"
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch --tags
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            latest=${latest:-v0.0.0}

            if [ -n "${{ inputs.version }}" ]; then
              new="${{ inputs.version }}"
              [[ "$new" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $new" >&2; exit 1; }
            else
              IFS='.' read -r major minor patch <<< "${latest#v}"
              case "${{ inputs.bump }}" in
                major) new="v$((major + 1)).0.0" ;;
                minor) new="v$major.$((minor + 1)).0" ;;
                *)     new="v$major.$minor.$((patch + 1))" ;;
              esac
            fi

            git rev-parse "$new" >/dev/null 2>&1 && { echo "tag $new already exists" >&2; exit 1; }
          else
            new="${GITHUB_REF_NAME}"
          fi

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release version::$new"
          echo "# Release $new" >> "$GITHUB_STEP_SUMMARY"

      # GITHUB_TOKEN pushes don't retrigger the tag-push job, so tag and release
      # happen in this one run.
      - name: Push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          NEW_TAG: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
